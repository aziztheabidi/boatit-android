image: ghcr.io/cirruslabs/android-sdk:tools # Use a pre-configured Docker image with Android SDK

variables:
  # Android SDK versions
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

stages:
  - verify
  - build
  - package

cache:
  paths:
    - ~/.gradle/caches/ # Cache Gradle dependencies
    - ~/.android/repositories/ # Cache Android SDK dependencies

verify-phase0-gates:
  stage: verify
  before_script:
    - chmod +x ./gradlew
  script:
    - echo "ANDROID_HOME=$ANDROID_HOME"
    - echo "PATH=$PATH"
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
    - sdkmanager "platform-tools"
    - sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
    - ./gradlew clean phase0Safety --no-daemon
    - ./gradlew ktlintCheck detekt --no-daemon || true
  artifacts:
    when: always
    paths:
      - app/build/reports/
      - app/build/outputs/

# Build Stage
build-job:
  stage: build
  before_script:
    - chmod +x ./gradlew
  script:
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
    - sdkmanager "platform-tools"
    - sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/debug/ # Path to the generated APK

# Package Stage
package-debug-apk:
  stage: package
  script:
    - echo "Debug APK generated and saved as an artifact"
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk # Path to the debug APK file
  tags:
    - package

