image: ghcr.io/cirruslabs/android-sdk:tools # Use a pre-configured Docker image with Android SDK

variables:
  # Android SDK versions
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

stages:
  - build
  - package

cache:
  paths:
    - ~/.gradle/caches/ # Cache Gradle dependencies
    - ~/.android/repositories/ # Cache Android SDK dependencies

# Build Stage
build-job:
  stage: build
  script:
    # Print the Android SDK location for verification
    - echo "ANDROID_HOME=$ANDROID_HOME"
    - echo "PATH=$PATH"
    # Accept licenses
    - yes | sdkmanager --licenses || true
    # Install the required SDK tools and packages
    - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
    - sdkmanager "platform-tools"
    - sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
    # Clean and build the project
    - ./gradlew clean assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/ # Path to the generated APK

# Package Stage
package-debug-apk:
  stage: package
  script:
    - echo "Debug APK generated and saved as an artifact"
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk # Path to the debug APK file
  tags:
    - package

